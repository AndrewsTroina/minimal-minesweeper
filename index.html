<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Minimal Games — Small Games, Quiet Design</title>

  <meta
    name="description"
    content="A collection of lightweight browser games designed for quick, simple play."
  >

  <meta
    name="robots"
    content="index, follow"
  >

  <link
    rel="canonical"
    href="https://example.com/"
  >

  <meta property="og:type" content="website">
  <meta property="og:title" content="Minimal Games">
  <meta
    property="og:description"
    content="A collection of lightweight browser games."
  >
  <meta
    property="og:url"
    content="https://example.com/"
  >

  <link
    rel="icon"
    href="/favicon.svg"
    type="image/svg+xml"
  >

  <script>
    (() => {
      try {
        const stored = localStorage.getItem("theme");

        if (
          stored === "light" ||
          stored === "dark"
        ) {
          document.documentElement.dataset.theme = stored;
          return;
        }

        if (
          window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches
        ) {
          document.documentElement.dataset.theme = "dark";
        }
      } catch {
        // System/default theme remains active.
      }
    })();
  </script>

  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
</head>

<body>

<header class="site-header">
  <a
    class="brand"
    href="/"
    aria-label="Minimal Games home"
  >
    <span class="brand-mark" aria-hidden="true">+</span>
    <span>MINIMAL GAMES</span>
  </a>

  <nav aria-label="Primary navigation">
    <a href="#games">GAMES</a>
    <a href="#about">ABOUT</a>

    <button
      class="theme-toggle"
      type="button"
      aria-label="Switch theme"
      aria-pressed="false"
    >
      <span aria-hidden="true">◐</span>
    </button>
  </nav>
</header>

<main>

  <section
    class="featured-section"
    aria-labelledby="featured-heading"
  >
    <div class="section-label">
      <span>01</span>
      <span id="featured-heading">FEATURED</span>
    </div>

    <div id="featured-game" class="featured-container">
      <div class="loading-state" role="status">
        Loading…
      </div>
    </div>
  </section>

  <section
    id="games"
    class="games-section"
    aria-labelledby="games-heading"
  >

    <div class="section-heading">
      <div class="section-label">
        <span>02</span>
        <span id="games-heading">GAMES</span>
      </div>

      <p class="section-description">
        Small games for a short break.
      </p>
    </div>

    <div class="catalog-controls">

      <div class="search-wrapper">
        <label for="game-search">
          Search games
        </label>

        <input
          id="game-search"
          type="search"
          name="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search"
        >
      </div>

      <div
        id="tag-filters"
        class="tag-filters"
        aria-label="Game categories"
      >
        <button
          class="tag-filter is-active"
          type="button"
          data-tag="all"
          aria-pressed="true"
        >
          ALL
        </button>
      </div>

    </div>

    <div
      id="game-grid"
      class="game-grid"
      aria-live="polite"
    ></div>

    <div
      id="empty-state"
      class="empty-state"
      hidden
    >
      <p>No games found.</p>
      <button
        id="clear-filters"
        type="button"
      >
        Clear filters
      </button>
    </div>

  </section>

</main>

<footer id="about" class="site-footer">
  <p>MINIMAL GAMES</p>
  <p>LIGHTWEIGHT BROWSER GAMES.</p>
</footer>

<noscript>
  <div class="noscript-message">
    JavaScript is required to browse the game collection.
  </div>
</noscript>

<script
  type="module"
  src="/assets/js/main.js"
></script>

</body>
</html>
